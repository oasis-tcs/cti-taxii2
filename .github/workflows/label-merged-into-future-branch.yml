# Adds the "Status: merged into future branch" label to issues that a pull
# request fixes when that pull request is merged into a branch other than the
# default branch (for example 2.1_errata1). GitHub only closes linked issues
# automatically for merges into the default branch, so these issues stay open
# until the future release lands; the label shows they are already resolved.
#
# Issues are taken from closing keywords in the PR title and description:
# "Fixes #123", "Closes issue #123", "Resolves <issue URL>". References that
# do not state the issue is resolved, such as "Refs #123", are ignored.
#
# Security: pull_request_target runs in the context of the base repository, so
# it can label issues for PRs from forks. This workflow never checks out or
# runs code from the pull request; it only reads the PR title and body.

name: Label issues merged into a future branch

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "Merged PR numbers to process, comma-separated (backfill)"
        required: true

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBERS: ${{ github.event.inputs.pr_numbers }}
        with:
          script: |
            const label = 'Status: merged into future branch';
            const { owner, repo } = context.repo;
            const issueUrl = `https://github\\.com/${owner}/${repo}/issues/`;
            const keyword = new RegExp(
              `\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s+(?:issue\\s+)?(?:#|${issueUrl})(\\d+)\\b`,
              'gi');
            const defaultBranch = context.payload.repository.default_branch;

            let pulls = [];
            if (context.eventName === 'workflow_dispatch') {
              const numbers = process.env.PR_NUMBERS.split(',').map(s => Number(s.trim())).filter(Boolean);
              for (const pull_number of numbers) {
                const { data } = await github.rest.pulls.get({ ...context.repo, pull_number });
                if (!data.merged || data.base.ref === defaultBranch) {
                  core.warning(`#${pull_number}: not merged into a non-default branch, skipped`);
                  continue;
                }
                pulls.push(data);
              }
            } else {
              pulls.push(context.payload.pull_request);
            }

            for (const pr of pulls) {
              const text = `${pr.title}\n${pr.body || ''}`;
              const issues = [...new Set([...text.matchAll(keyword)].map(m => Number(m[1])))];
              for (const issue_number of issues) {
                try {
                  const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                  if (issue.pull_request) continue;
                  await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: [label] });
                  core.info(`PR #${pr.number}: labeled issue #${issue_number}`);
                } catch (error) {
                  core.warning(`PR #${pr.number}: could not label #${issue_number}: ${error.message}`);
                }
              }
            }
