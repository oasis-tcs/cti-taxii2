# Adds the "Status: merged into future branch" label to open issues that a
# pull request fixes when that pull request was merged into a branch other than
# the default branch (for example 2.1_errata1). GitHub only closes linked
# issues automatically for merges into the default branch, so these issues stay
# open until the future release lands; the label shows they are already
# resolved.
#
# Issues are taken from closing keywords in the PR title and description:
# "Fixes #123", "Closes issue #123", "Resolves <issue URL>". References that
# do not state the issue is resolved, such as "Refs #123", are ignored.
#
# Runs hourly on PRs merged in the last 48 hours, and can be run by hand for
# specific PR numbers (backfill). It uses schedule and workflow_dispatch rather
# than pull_request_target: no code from pull requests is checked out or run,
# and no repository event policy needs to allow pull_request_target.

name: Label issues merged into a future branch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "Merged PR numbers to process, comma-separated (leave empty for the last 48 hours)"
        required: false

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBERS: ${{ github.event.inputs.pr_numbers }}
        with:
          script: |
            const label = 'Status: merged into future branch';
            const lookbackHours = 48;
            const { owner, repo } = context.repo;
            const issueUrl = `https://github\\.com/${owner}/${repo}/issues/`;
            const keyword = new RegExp(
              `\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s+(?:issue\\s+)?(?:#|${issueUrl})(\\d+)\\b`,
              'gi');

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;
            const mergedIntoFutureBranch = pr => pr.merged_at && pr.base.ref !== defaultBranch;

            let pulls = [];
            const requested = (process.env.PR_NUMBERS || '').split(',').map(s => Number(s.trim())).filter(Boolean);
            if (requested.length) {
              for (const pull_number of requested) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number });
                if (mergedIntoFutureBranch(data)) pulls.push(data);
                else core.warning(`#${pull_number}: not merged into a non-default branch, skipped`);
              }
            } else {
              const since = Date.now() - lookbackHours * 3600 * 1000;
              const { data } = await github.rest.pulls.list({
                owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100 });
              pulls = data.filter(pr => mergedIntoFutureBranch(pr) && Date.parse(pr.merged_at) >= since);
            }

            for (const pr of pulls) {
              const text = `${pr.title}\n${pr.body || ''}`;
              const issues = [...new Set([...text.matchAll(keyword)].map(m => Number(m[1])))];
              for (const issue_number of issues) {
                try {
                  const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
                  if (issue.pull_request || issue.state !== 'open') continue;
                  if (issue.labels.some(l => l.name === label)) continue;
                  await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
                  core.info(`PR #${pr.number}: labeled issue #${issue_number}`);
                } catch (error) {
                  core.warning(`PR #${pr.number}: could not label #${issue_number}: ${error.message}`);
                }
              }
            }
